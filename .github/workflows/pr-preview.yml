name: PR Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: ["master"]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build CSS
        run: npx @tailwindcss/cli -i ./assets/css/styles.css -o ./assets/css/styles_min.css --minify

      - name: Deploy to GitHub Pages (PR Preview)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          destination_dir: pr-${{ github.event.pull_request.number }}
          publish_branch: gh-pages
          cname: database.gkanev.com

      - name: Get custom domain
        id: get-domain
        run: |
          # Check if CNAME file exists in gh-pages branch
          if git ls-remote --exit-code --heads origin gh-pages > /dev/null 2>&1; then
            CNAME=$(git show origin/gh-pages:CNAME 2>/dev/null || echo "")
            if [ -n "$CNAME" ]; then
              echo "domain=$CNAME" >> $GITHUB_OUTPUT
            else
              echo "domain=${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
            fi
          else
            echo "domain=${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const domain = '${{ steps.get-domain.outputs.domain }}';
            const previewUrl = `https://${domain}/pr-${prNumber}/`;

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview deployment')
            );

            const commentBody = `## 🚀 Preview deployment ready!

            **Preview URL:** ${previewUrl}

            Updated automatically with each commit.`;

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }

  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'

    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove PR preview directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          rm -rf pr-${{ github.event.pull_request.number }}
          git add .
          git commit -m "Remove preview for PR #${{ github.event.pull_request.number }}" || echo "Nothing to remove"
          git push
